<!DOCTYPE html>
<html lang="en-US" data-theme="claude" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Claude Replica</title>
    <meta name="description" content="Static Claude-style chat homepage replica.">
    <style>
        :root {
            color-scheme: light;
            --bg-000: #ffffff;
            --bg-050: #fbfaf8;
            --bg-100: #f7f4ee;
            --bg-200: #efeae2;
            --bg-250: #ebe5db;
            --bg-300: #e2dbcf;
            --bg-400: #d5ccbf;
            --text-000: #14110d;
            --text-100: #231f1a;
            --text-200: #5f564b;
            --text-300: #7b7267;
            --text-400: #968d82;
            --text-500: #aaa095;
            --border-100: rgba(40, 28, 15, 0.07);
            --border-200: rgba(40, 28, 15, 0.1);
            --border-300: rgba(40, 28, 15, 0.14);
            --border-400: rgba(40, 28, 15, 0.18);
            --accent-brand: #d97745;
            --accent-brand-soft: rgba(217, 119, 69, 0.12);
            --shadow-soft: 0 10px 40px rgba(38, 27, 15, 0.06);
            --shadow-card: 0 18px 48px rgba(38, 27, 15, 0.08);
            --sidebar-width: 18rem;
            --sidebar-collapsed-width: 5.5rem;
            --radius-xl: 22px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --font-ui: "Aptos", "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
            --font-display: "Georgia", "Times New Roman", serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: var(--font-ui);
            color: var(--text-100);
            background:
                radial-gradient(circle at top left, rgba(255, 252, 245, 0.96) 0%, rgba(255, 252, 245, 0) 24%),
                radial-gradient(circle at top right, rgba(222, 200, 171, 0.24) 0%, rgba(222, 200, 171, 0) 26%),
                linear-gradient(180deg, #faf7f1 0%, #f6f2eb 50%, #f7f3ed 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(46, 33, 18, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(46, 33, 18, 0.035) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0) 72%);
            opacity: 0.45;
        }

        button,
        a,
        [contenteditable="true"] {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        svg {
            display: block;
        }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
            height: 100vh;
            position: relative;
        }

        .sidebar-shell {
            position: relative;
            width: var(--sidebar-width);
            transition: width 160ms ease, transform 180ms ease;
            z-index: 20;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: inherit;
            display: flex;
            flex-direction: column;
            background: rgba(247, 244, 238, 0.92);
            border-right: 1px solid var(--border-100);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 18px 0 42px rgba(32, 22, 12, 0.03);
        }

        .sidebar-head {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0.65rem 0.75rem 0 0.85rem;
            min-height: 3.1rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            height: 2rem;
            min-width: 0;
            overflow: hidden;
            color: var(--text-100);
        }

        .brand-spark {
            flex: 0 0 auto;
            width: 1rem;
            height: 1rem;
            color: var(--accent-brand);
        }

        .brand-wordmark {
            width: 4.25rem;
            height: 1rem;
            flex: 0 0 auto;
        }

        .icon-button,
        .ghost-nav,
        .nav-link,
        .panel-pill,
        .category-button,
        .user-card,
        .mobile-menu-button,
        .model-button {
            border-radius: 0.9rem;
            transition:
                background-color 90ms ease,
                color 90ms ease,
                border-color 90ms ease,
                transform 90ms ease,
                opacity 120ms ease;
        }

        .icon-button {
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-400);
        }

        .icon-button:hover,
        .ghost-nav:hover,
        .nav-link:hover,
        .model-button:hover,
        .voice-button:hover {
            background: var(--bg-200);
            color: var(--text-100);
        }

        .sidebar-toggle {
            position: absolute;
            right: 0.5rem;
            top: 0.45rem;
        }

        .sidebar-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-group {
            padding: 0.3rem 0.5rem 0;
        }

        .nav-link {
            width: 100%;
            min-height: 2.75rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.9rem;
            color: var(--text-100);
        }

        .nav-link .nav-icon-wrap {
            width: 1.45rem;
            height: 1.45rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            color: inherit;
        }

        .nav-link.primary-link .nav-icon-wrap {
            background: rgba(35, 31, 26, 0.1);
        }

        .nav-link:hover .nav-icon-wrap {
            transform: scale(1.04) rotate(-2deg);
        }

        .nav-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-label,
        .brand-wordmark,
        .shortcut,
        .user-copy,
        .download-apps,
        .user-chevron,
        .empty-state,
        .nav-divider {
            transition: opacity 110ms ease, transform 110ms ease, width 110ms ease;
        }

        .nav-label {
            min-width: 0;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .shortcut {
            font-size: 0.74rem;
            color: var(--text-500);
            opacity: 0;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .nav-link:hover .shortcut {
            opacity: 1;
        }

        .sidebar-group.scroller {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding-top: 1rem;
        }

        .sidebar-group.scroller::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar-group.scroller::-webkit-scrollbar-thumb {
            background: rgba(70, 56, 42, 0.15);
            border-radius: 999px;
        }

        .empty-state {
            margin: 1.2rem 0.55rem 0;
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-500);
            font-size: 0.9rem;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-100);
            padding: 0;
        }

        .user-card {
            width: 100%;
            min-height: 5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.65rem 0.75rem;
            border-radius: 0;
        }

        .user-card:hover {
            background: rgba(233, 226, 215, 0.55);
        }

        .avatar {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #b7ab9a;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.02em;
            flex: 0 0 auto;
        }

        .user-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            text-align: left;
        }

        .user-name {
            font-size: 0.94rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-plan {
            font-size: 0.75rem;
            color: var(--text-500);
        }

        .download-apps {
            width: 2rem;
            height: 2rem;
            border-radius: 0.65rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(55, 40, 25, 0.12);
            color: var(--text-300);
            flex: 0 0 auto;
        }

        .download-apps:hover {
            background: var(--bg-200);
            border-color: transparent;
        }

        .user-chevron {
            color: var(--text-300);
            flex: 0 0 auto;
        }

        .workspace {
            position: relative;
            min-width: 0;
            min-height: 100vh;
            overflow: hidden auto;
        }

        .workspace-inner {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(1rem, 2vw, 1.4rem) clamp(1rem, 2.6vw, 2rem) 3rem;
        }

        .mobile-menu-button {
            display: none;
            position: fixed;
            left: 1rem;
            top: 0.95rem;
            z-index: 24;
            width: 2.4rem;
            height: 2.4rem;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border-200);
            box-shadow: var(--shadow-soft);
        }

        .utility-corner {
            position: fixed;
            right: 0.9rem;
            top: 0.7rem;
            z-index: 14;
        }

        .utility-corner .icon-button {
            width: 2.15rem;
            height: 2.15rem;
            background: transparent;
        }

        .main-center {
            width: 100%;
            max-width: 44rem;
            margin-top: clamp(3.5rem, 11vh, 7rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.55rem;
        }

        .panel-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 2rem;
            padding: 0 0.8rem;
            border-radius: 0.75rem;
            background: var(--bg-200);
            color: var(--text-300);
            font-size: 0.94rem;
            user-select: none;
        }

        .panel-pill a {
            text-decoration: underline;
            text-underline-offset: 0.2rem;
            text-decoration-color: rgba(123, 114, 103, 0.4);
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            color: var(--text-200);
            font-family: var(--font-display);
            font-size: clamp(1.9rem, 1.2rem + 2vw, 2.55rem);
            line-height: 1.4;
            text-align: center;
        }

        .hero-icon {
            width: 2rem;
            height: 2rem;
            color: var(--accent-brand);
            flex: 0 0 auto;
        }

        .hero-title {
            white-space: nowrap;
            user-select: none;
        }

        .composer-stack {
            width: 100%;
        }

        .counter-wrap {
            padding-inline: 0.15rem;
        }

        .counter-card {
            border: 1px solid var(--border-300);
            border-bottom: 0;
            border-radius: 1rem 1rem 0 0;
            background: var(--bg-200);
            padding: 0.55rem 0.95rem 0.5rem;
            font-size: 0.92rem;
            color: var(--text-200);
            text-align: center;
        }

        .counter-meta {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .composer-card {
            position: relative;
            border-radius: 1.35rem;
            background: var(--bg-000);
            padding: 0.95rem;
            box-shadow:
                0 0.25rem 1.25rem rgba(20, 17, 13, 0.035),
                0 0 0 0.5px rgba(80, 60, 30, 0.15);
        }

        .composer-card:hover,
        .composer-card:focus-within {
            box-shadow:
                0 0.25rem 1.35rem rgba(20, 17, 13, 0.075),
                0 0 0 0.5px rgba(80, 60, 30, 0.22);
        }

        .editor-shell {
            position: relative;
            min-height: 5.35rem;
            display: flex;
            align-items: stretch;
        }

        .editor {
            width: 100%;
            min-height: 5.35rem;
            max-height: 24rem;
            overflow: auto;
            padding: 0.7rem 0.72rem 0.8rem;
            outline: none;
            font-size: 1rem;
            line-height: 1.55;
            color: var(--text-100);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .editor::-webkit-scrollbar {
            width: 8px;
        }

        .editor::-webkit-scrollbar-thumb {
            background: rgba(60, 45, 28, 0.12);
            border-radius: 999px;
        }

        .editor-placeholder {
            position: absolute;
            left: 0.82rem;
            top: 0.75rem;
            color: var(--text-500);
            pointer-events: none;
        }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .composer-left,
        .composer-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .model-button {
            min-height: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0 0.75rem;
            color: var(--text-100);
            font-size: 0.93rem;
            white-space: nowrap;
        }

        .voice-button {
            width: 2rem;
            height: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.7rem;
            color: var(--text-100);
            transition: background-color 100ms ease;
        }

        .category-list {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            margin: 0;
            padding: 0.2rem 0 0;
            list-style: none;
        }

        .category-button {
            height: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.42rem;
            padding: 0 0.8rem;
            border: 1px solid var(--border-300);
            background: rgba(247, 244, 238, 0.86);
            color: var(--text-200);
            font-size: 0.92rem;
            white-space: nowrap;
        }

        .category-button:hover,
        .category-button[aria-selected="true"] {
            background: var(--bg-300);
            border-color: transparent;
            color: var(--text-100);
        }

        .category-button svg {
            color: var(--text-400);
        }

        .category-button:hover svg,
        .category-button[aria-selected="true"] svg {
            color: var(--text-200);
        }

        .backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(23, 18, 13, 0.28);
            z-index: 18;
        }

        .desktop-collapsed .app-shell {
            grid-template-columns: var(--sidebar-collapsed-width) minmax(0, 1fr);
        }

        .desktop-collapsed .sidebar-shell {
            width: var(--sidebar-collapsed-width);
        }

        .desktop-collapsed .brand-wordmark,
        .desktop-collapsed .nav-label,
        .desktop-collapsed .shortcut,
        .desktop-collapsed .empty-state,
        .desktop-collapsed .user-copy,
        .desktop-collapsed .download-apps,
        .desktop-collapsed .user-chevron {
            opacity: 0;
            width: 0;
            transform: translateX(-6px);
            overflow: hidden;
            pointer-events: none;
        }

        .desktop-collapsed .brand {
            justify-content: center;
            width: 100%;
        }

        .desktop-collapsed .sidebar-head {
            padding-inline: 0.4rem;
            justify-content: center;
        }

        .desktop-collapsed .sidebar-toggle {
            right: 0.15rem;
        }

        .desktop-collapsed .nav-link {
            justify-content: center;
            padding-inline: 0.45rem;
        }

        .desktop-collapsed .nav-copy {
            flex: 0 0 auto;
        }

        .desktop-collapsed .user-card {
            justify-content: center;
            padding-inline: 0.4rem;
        }

        .desktop-collapsed .user-card .avatar {
            margin: 0;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
            }

            .app-shell {
                grid-template-columns: 1fr;
                min-height: 100vh;
                height: auto;
            }

            .mobile-menu-button {
                display: inline-flex;
            }

            .sidebar-shell {
                position: fixed;
                inset: 0 auto 0 0;
                width: min(18rem, calc(100vw - 2.8rem));
                transform: translateX(-102%);
                box-shadow: none;
            }

            .sidebar-shell.mobile-open {
                transform: translateX(0);
            }

            .sidebar {
                width: min(18rem, calc(100vw - 2.8rem));
                box-shadow: var(--shadow-card);
            }

            .workspace {
                min-height: 100vh;
                padding-bottom: 2rem;
            }

            .workspace-inner {
                padding-inline: 0.75rem;
            }

            .main-center {
                margin-top: 4.8rem;
                max-width: 100%;
                gap: 1.25rem;
            }

            .hero {
                font-size: clamp(1.5rem, 5vw, 2rem);
                gap: 0.6rem;
            }

            .hero-title {
                white-space: normal;
            }

            .composer-card {
                padding: 0.8rem;
            }

            .category-list {
                justify-content: flex-start;
            }

            .backdrop.mobile-visible {
                display: block;
            }
        }

        @media (max-width: 640px) {
            .counter-card {
                font-size: 0.84rem;
            }

            .composer-footer {
                flex-wrap: wrap;
            }

            .composer-right {
                width: 100%;
                justify-content: space-between;
            }

            .model-button {
                padding-left: 0.55rem;
                padding-right: 0.55rem;
            }
        }
    </style>
</head>
<body>
    <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">

        </svg>
    </button>

    <div class="utility-corner">
        <button class="icon-button" type="button" aria-label="Use incognito">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <g>
                    <path d="M6.99951 8.66672C7.5518 8.66672 7.99951 9.11443 7.99951 9.66672C7.9993 10.2188 7.55166 10.6667 6.99951 10.6667C6.44736 10.6667 5.99973 10.2188 5.99951 9.66672C5.99951 9.11443 6.44723 8.66672 6.99951 8.66672Z"></path>

            </svg>
        </button>
    </div>

    <div class="app-shell">
        <aside class="sidebar-shell" id="sidebarShell" aria-label="Sidebar">
            <nav class="sidebar">
                <div class="sidebar-head">
                    <a class="brand" href="#" aria-label="Claude home">

    <script>
        (function () {
            const body = document.body;
            const sidebarShell = document.getElementById("sidebarShell");
            const sidebarToggle = document.getElementById("sidebarToggle");
            const sidebarBackdrop = document.getElementById("sidebarBackdrop");
            const mobileMenuButton = document.getElementById("mobileMenuButton");
            const editor = document.getElementById("composerEditor");
            const placeholder = document.getElementById("composerPlaceholder");
            const newChatButton = document.getElementById("newChatButton");
            const fileButton = document.getElementById("fileButton");
            const mockFileInput = document.getElementById("mockFileInput");
            const categoryButtons = document.querySelectorAll(".category-button");

            function syncPlaceholder() {
                placeholder.style.display = editor.textContent.trim() ? "none" : "block";
            }

            function closeMobileSidebar() {
                sidebarShell.classList.remove("mobile-open");
                sidebarBackdrop.classList.remove("mobile-visible");
            }

            function openMobileSidebar() {
                sidebarShell.classList.add("mobile-open");
                sidebarBackdrop.classList.add("mobile-visible");
            }

            function toggleSidebar() {
                if (window.innerWidth <= 980) {
                    if (sidebarShell.classList.contains("mobile-open")) {
                        closeMobileSidebar();
                    } else {
                        openMobileSidebar();
                    }
                    return;
                }

                body.classList.toggle("desktop-collapsed");
                const collapsed = body.classList.contains("desktop-collapsed");
                sidebarToggle.setAttribute("aria-label", collapsed ? "Open sidebar" : "Close sidebar");
                sidebarToggle.setAttribute("aria-pressed", String(!collapsed));
            }

            syncPlaceholder();

            editor.addEventListener("input", syncPlaceholder);
            editor.addEventListener("focus", syncPlaceholder);
            editor.addEventListener("blur", syncPlaceholder);
            editor.addEventListener("keydown", function (event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    document.querySelector(".counter-card").animate(
                        [
                            { transform: "translateY(0)" },
                            { transform: "translateY(-2px)" },
                            { transform: "translateY(0)" }
                        ],
                        { duration: 220, easing: "ease-out" }
                    );
                }
            });

            sidebarToggle.addEventListener("click", toggleSidebar);
            mobileMenuButton.addEventListener("click", openMobileSidebar);
            sidebarBackdrop.addEventListener("click", closeMobileSidebar);

            window.addEventListener("resize", function () {
                if (window.innerWidth > 980) {
                    closeMobileSidebar();
                }
            });

            newChatButton.addEventListener("click", function () {
                editor.textContent = "";
                syncPlaceholder();
                editor.focus();
            });

            fileButton.addEventListener("click", function () {
                mockFileInput.click();
            });

            categoryButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    categoryButtons.forEach(function (item) {
                        item.setAttribute("aria-selected", "false");
                    });
                    button.setAttribute("aria-selected", "true");
                });
            });
        }());
    </script>
